dependencies {
    api project(":core")
    api("org.graalvm.polyglot:polyglot:${graalvmPolyglotVersion}")
    api("org.graalvm.polyglot:js-community:${graalvmPolyglotVersion}")

    testImplementation project(":tests")
}

tasks.register("bench", JavaExec) {
    group = "verification"
    description = "Runs the engine benchmark. Iterations: -PbenchIterations=1000, reused context: -PbenchReuse=true"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.rapatao.projects.ruleset.engine.evaluator.graaljs.GraalJSBenchmarkKt"
    args = [
        providers.gradleProperty("benchIterations").getOrElse("1000"),
        providers.gradleProperty("benchReuse").getOrElse("false"),
    ]
}
