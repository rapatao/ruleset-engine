dependencies {
    api project(":core")

    testImplementation project(":tests")
}

tasks.register("bench", JavaExec) {
    group = "verification"
    description = "Runs the engine benchmark. Iterations: -PbenchIterations=1000, wide input: -PbenchWide=200"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.rapatao.projects.ruleset.engine.evaluator.kotlin.KotlinBenchmarkKt"
    args = [
        providers.gradleProperty("benchIterations").getOrElse("1000"),
        providers.gradleProperty("benchWide").getOrElse("0"),
        providers.gradleProperty("benchReuse").getOrElse("false"),
    ]
}
